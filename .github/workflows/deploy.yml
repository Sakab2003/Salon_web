name: 🚀 Deploy to salon.kuilinga.tech (MANUEL)

# Déclenchement MANUEL uniquement — va sur GitHub > Actions > Run workflow
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Taper "deployer" pour confirmer'
        required: false
        default: 'deployer'

jobs:
  deploy:
    name: Déploiement automatique
    runs-on: ubuntu-latest
    if: ${{ secrets.SSH_HOST != '' }}

    steps:
      # ─────────────────────────────────────────────────────────────
      # 1. Récupère le code du dépôt (pour info, le vrai déploiement
      #    se fait via SSH sur le serveur)
      # ─────────────────────────────────────────────────────────────
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────
      # 2. Connexion SSH au serveur et mise à jour du code
      # ─────────────────────────────────────────────────────────────
      - name: 🔄 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          # Si vous avez une clé privée, remplacez password par :
          # key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "🚀 Déploiement Kuilinga — $(date)"
            cd ${{ secrets.APP_PATH }}

            echo "── git pull ──"
            git pull origin master

            echo "── composer install ──"
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "── migrations ──"
            php artisan migrate --force

            echo "── seeders ──"
            php artisan db:seed --class=PaymentGatewaySeeder --force || true
            php artisan db:seed --class=TestPlanSeeder --force || true

            echo "── cache clear ──"
            php artisan config:clear
            php artisan route:clear
            php artisan cache:clear
            php artisan view:clear

            echo "✅ Déploiement terminé"
